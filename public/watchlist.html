<!DOCTYPE html>
<html>
<head>
  <title>My Watchlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white font-sans p-10">

<h1 class="text-3xl mb-8">⭐ My Watchlist</h1>

<div id="watchlistContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

<script>

async function loadWatchlist() {
  const token = localStorage.getItem("token");

  if (!token) {
    alert("Please login first");
    window.location.href = "login.html";
    return;
  }

  const res = await fetch("/api/watchlist", {
    headers: {
      "Authorization": `Bearer ${token}`
    }
  });

  const dramas = await res.json();

  const container = document.getElementById("watchlistContainer");
  container.innerHTML = "";

  dramas.forEach(drama => {
    container.innerHTML += `
      <div class="bg-gray-900 rounded-lg overflow-hidden">
        <img src="${drama.image}" class="w-full h-60 object-cover"/>
        <div class="p-4">
          <h4 class="font-bold text-lg">${drama.title}</h4>
          <p class="text-gray-400 text-sm">${drama.genre}</p>
        </div>
      </div>
    `;
  });
}

loadWatchlist();

</script>

</body>
</html>
