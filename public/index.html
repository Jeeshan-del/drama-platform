<!DOCTYPE html>
<html>
<head>
  <title>Drama Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white font-sans">

<nav class="p-4 bg-black text-red-600 text-xl font-bold fixed w-full flex justify-between">
  🎬 Drama Platform

  <input id="searchInput"
         type="text"
         placeholder="Search dramas..."
         class="bg-gray-800 text-white px-4 py-1 rounded outline-none text-sm" />
</nav>

<section class="pt-20 px-10">
  <h2 class="text-3xl mb-8">🔥 Trending Now</h2>
  <div id="dramaContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</section>

<script>

const container = document.getElementById("dramaContainer");
const searchInput = document.getElementById("searchInput");

async function loadDramas(searchTerm = "") {
  const res = await fetch(`/api/dramas?search=${searchTerm}`);
  const dramas = await res.json();

  container.innerHTML = "";

  dramas.forEach(drama => {
    container.innerHTML += `
      <a href="drama.html?id=${drama._id}"
         class="relative bg-gray-900 rounded-lg overflow-hidden hover:scale-105 transition duration-300">
        <div class="absolute top-3 right-3 bg-yellow-400 text-black px-3 py-1 rounded-full font-bold">
          ⭐ ${drama.rating}
        </div>
        <img src="${drama.image}" class="w-full h-60 object-cover"/>
        <div class="p-4">
          <h4 class="font-bold text-lg">${drama.title}</h4>
          <p class="text-gray-400 text-sm">${drama.genre}</p>
        </div>
      </a>
    `;
  });
}

// Load all dramas initially
loadDramas();

// Live search
searchInput.addEventListener("keyup", () => {
  loadDramas(searchInput.value);
});

</script>

</body>
</html>
