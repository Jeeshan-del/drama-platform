<!DOCTYPE html>
<html>
<head>
  <title>Drama Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white font-sans">

<!-- ================= NAVBAR ================= -->
<nav class="flex justify-between items-center px-8 py-4 bg-black bg-opacity-95 fixed w-full z-50 shadow-lg">

  <!-- LOGO -->
  <h1 class="text-2xl font-bold text-red-600">🎬 Drama Platform</h1>

  <!-- NAV LINKS -->
  <div class="hidden md:flex space-x-6 items-center">
    <a href="/" class="hover:text-red-500">Home</a>
    <a href="#" class="hover:text-red-500">Dramas</a>
    <a href="#" class="hover:text-red-500">Movies</a>
    <a href="#" class="hover:text-red-500">Actors</a>
    <a href="#" class="hover:text-red-500">News</a>
  </div>

  <!-- RIGHT SIDE -->
  <div class="flex items-center space-x-4">

    <!-- SEARCH -->
    <input id="searchInput"
           type="text"
           placeholder="Search dramas..."
           class="bg-gray-800 text-white px-4 py-1 rounded outline-none text-sm hidden md:block" />

    <!-- AUTH BUTTONS -->
    <a href="signup.html"
       class="bg-red-600 px-4 py-2 rounded hover:bg-red-700 text-sm">
      Sign Up
    </a>

    <a href="login.html"
       class="border border-white px-4 py-2 rounded hover:bg-white hover:text-black text-sm">
      Login
    </a>

  </div>

</nav>

<!-- ================= CONTENT ================= -->
<section class="pt-24 px-10">

  <h2 class="text-3xl mb-8">🔥 Trending Now</h2>

  <div id="dramaContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>

</section>

<!-- ================= FOOTER ================= -->
<footer class="bg-gray-900 text-center py-6 mt-20">
  <p class="text-gray-400">© 2026 Drama Platform. All rights reserved.</p>
</footer>

<!-- ================= SCRIPT ================= -->
<script>

const container = document.getElementById("dramaContainer");
const searchInput = document.getElementById("searchInput");

// Load dramas from API
async function loadDramas(searchTerm = "") {
  const res = await fetch(`/api/dramas?search=${searchTerm}`);
  const dramas = await res.json();

  container.innerHTML = "";

  dramas.forEach(drama => {
    container.innerHTML += `
      <a href="drama.html?id=${drama._id}"
         class="relative bg-gray-900 rounded-lg overflow-hidden hover:scale-105 transition duration-300 cursor-pointer">

        <div class="absolute top-3 right-3 bg-yellow-400 text-black px-3 py-1 rounded-full font-bold">
          ⭐ ${drama.rating}
        </div>

        <img src="${drama.image}" class="w-full h-60 object-cover"/>

        <div class="p-4">
          <h4 class="font-bold text-lg">${drama.title}</h4>
          <p class="text-gray-400 text-sm">${drama.genre}</p>
        </div>

      </a>
    `;
  });
}

// Initial load
loadDramas();

// Live search
searchInput.addEventListener("keyup", () => {
  loadDramas(searchInput.value);
});

</script>

</body>
</html>
