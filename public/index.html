<!DOCTYPE html>
<html>
<head>
  <title>Drama Platform</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      background: #1c1c1c;
    }
    .hero {
      margin-top: 100px;
    }
    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      background: #e50914;
      color: white;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }
    button:hover {
      background: #ff1e2d;
    }
  </style>
</head>
<body>

<header>🎬 Drama Platform</header>

<div class="hero">
  <h1>Discover Asian Dramas & Movies</h1>
  <p>Track, rate and review your favorite dramas.</p>

  <button onclick="location.href='/signup'">Sign Up</button>
  <button onclick="location.href='/login'">Login</button>
</div>

</body>
</html>
