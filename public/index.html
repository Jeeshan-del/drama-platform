<!DOCTYPE html>
<html>
<head>
  <title>Drama Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white font-sans">

<nav class="flex justify-between items-center px-8 py-4 bg-black fixed w-full">

  <h1 class="text-2xl font-bold text-red-600">🎬 Drama Platform</h1>

  <div class="flex items-center space-x-4">

    <a href="watchlist.html" class="hover:text-red-500">My Watchlist</a>

    <input id="searchInput"
           type="text"
           placeholder="Search..."
           class="bg-gray-800 text-white px-4 py-1 rounded outline-none text-sm" />

    <div id="authButtons"></div>

  </div>
</nav>

<section class="pt-20 px-10">
  <h2 class="text-3xl mb-8">🔥 Trending Now</h2>
  <div id="dramaContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</section>

<script>
const container = document.getElementById("dramaContainer");
const searchInput = document.getElementById("searchInput");

// LOAD DRAMAS
async function loadDramas(searchTerm = "") {
  const res = await fetch(`/api/dramas?search=${searchTerm}`);
  const dramas = await res.json();

  container.innerHTML = "";

  dramas.forEach(drama => {
    container.innerHTML += `
      <a href="drama.html?id=${drama._id}"
         class="relative bg-gray-900 rounded-lg overflow-hidden hover:scale-105 transition duration-300">

        <div class="absolute top-3 right-3 bg-yellow-400 text-black px-3 py-1 rounded-full font-bold">
          ⭐ ${drama.rating}
        </div>

        <img src="${drama.image}" class="w-full h-60 object-cover"/>

        <div class="p-4">
          <h4 class="font-bold text-lg">${drama.title}</h4>
          <p class="text-gray-400 text-sm">${drama.genre}</p>
        </div>
      </a>
    `;
  });
}

loadDramas();

searchInput.addEventListener("keyup", () => {
  loadDramas(searchInput.value);
});

// AUTH UI
function renderAuthButtons() {
  const token = localStorage.getItem("token");
  const div = document.getElementById("authButtons");

  if (token) {
    div.innerHTML = `
      <button onclick="logout()"
              class="border border-white px-4 py-2 rounded hover:bg-white hover:text-black text-sm">
        Logout
      </button>
    `;
  } else {
    div.innerHTML = `
      <a href="signup.html"
         class="bg-red-600 px-4 py-2 rounded hover:bg-red-700 text-sm">
        Sign Up
      </a>
      <a href="login.html"
         class="border border-white px-4 py-2 rounded hover:bg-white hover:text-black text-sm">
        Login
      </a>
    `;
  }
}

function logout() {
  localStorage.removeItem("token");
  window.location.reload();
}

renderAuthButtons();
</script>

</body>
</html>
