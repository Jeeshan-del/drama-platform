<!DOCTYPE html>
<html>
<head>
  <title>Drama Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white font-sans p-10">

<a href="/" class="text-red-500 mb-6 inline-block">← Back</a>

<div id="dramaDetails"></div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadDrama() {
  const res = await fetch(`/api/dramas/${id}`);
  const drama = await res.json();

  document.getElementById("dramaDetails").innerHTML = `
    <h1 class="text-4xl font-bold mb-4">${drama.title}</h1>
    <img src="${drama.image}" class="w-full max-w-xl mb-6"/>
    <p class="mb-2">⭐ ${drama.rating}</p>
    <p class="mb-2">${drama.genre}</p>
    <p class="text-gray-400">${drama.description}</p>
  `;
}

loadDrama();
</script>

</body>
</html>
